name: CCF CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ccf_test"
  TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ccf_test"
  # Fuente única de verdad del umbral de cobertura backend (heredero en todos
  # los jobs; debe coincidir con el target `make coverage-gate`). Ya no vive en
  # pytest.ini para que los subconjuntos de tests locales no fallen por
  # cobertura parcial.
  COV_THRESHOLD: "38"

jobs:
  # ── Quality Gate ─────────────────────────────────────────────
  backend-quality:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    env:
      # Los tests corren sobre SQLite en memoria (mismo comportamiento que
      # el entorno dev: tests/conftest.py cae a ``sqlite://`` con StaticPool).
      # Con pytest-xdist cada worker es un proceso independiente con su propia
      # BD en memoria → aislamiento seguro y paralelo. El job migrations-check
      # valida Postgres/alembic por separado.
      DATABASE_URL: "sqlite://"
      TEST_DATABASE_URL: "sqlite://"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit ruff

      - name: Lint with Ruff
        # Uses select/ignore/per-file-ignores from pyproject.toml
        run: ruff check backend/

      - name: Lint CRM backend (import organization)
        # Dedicated gate for CRM modules to catch import organization
        # regressions before they reach main.
        run: bash scripts/lint-crm.sh

      - name: Lint Academy backend (import organization)
        run: bash scripts/lint-academy.sh

      - name: Lint Evangelism backend (import organization)
        run: bash scripts/lint-evangelism.sh

      - name: Lint CMS backend (import organization)
        run: bash scripts/lint-cms.sh

      - name: Security scan with Bandit
        # Security findings must fail CI; the JSON report remains available
        # for diagnosis when the scan rejects a change.
        run: bandit -r backend/ -c .bandit -f json -o bandit-report.json

      - name: Type check (mypy)
        run: |
          pip install mypy
          mypy backend/ --config-file mypy.ini --ignore-missing-imports

      - name: Run non-CRM tests with coverage (SQLite + xdist)
        # CRM tests have their own dedicated job to surface regressions quickly.
        # - rm -f .coverage*: un .coverage previo (corrupto o de otra versión de
        #   coverage.py) rompe el gate con "no such table: tracer" y deja la
        #   cobertura en 0. Siempre arrancamos con estado limpio.
        # - -n auto: paraleliza en N workers (1 por CPU). La suite completa
        #   (>15 min en Postgres serial) baja a ~2-4 min en SQLite paralelo.
        run: |
          rm -f .coverage .coverage.*
          pytest tests/ -q -n auto --cov=backend --cov-report=xml --cov-report=term --cov-fail-under=$COV_THRESHOLD --ignore-glob='tests/test_crm_*.py'

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Check coverage threshold
        # Fuente única de verdad: COV_THRESHOLD (env del job) — debe coincidir
        # con `make coverage-gate`. pytest-cov ya falla la corrida si no se
        # alcanza (--cov-fail-under=$COV_THRESHOLD); este paso lo verifica de
        # nuevo sobre coverage.xml para un mensaje explícito.
        run: |
          THRESHOLD=${COV_THRESHOLD:-38}
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree=ET.parse('coverage.xml'); root=tree.getroot(); rate=float(root.get('line-rate')); print(f'{rate*100:.1f}')")
          echo "Coverage: $COVERAGE% (threshold: $THRESHOLD%)"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage below $THRESHOLD% threshold"
            exit 1
          fi

  # ── Frontend Quality Gate ────────────────────────────────────
  frontend-quality:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Detect new `any` in frontend test files
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          python3 scripts/check-frontend-test-any.py --base-branch origin/${{ github.base_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # The repository lockfile is generated with the workspace's explicit
        # legacy-peer-deps policy. Keep CI and local reproducible installs on
        # the same resolver contract while the Storybook/Vite peer graph is
        # being converged.
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Lint (ESLint)
        run: cd frontend && npm run lint

      - name: Type check (TypeScript)
        run: cd frontend && npx tsc --noEmit

      - name: Run unit tests with coverage
        run: cd frontend && npx vitest run --coverage

      - name: Build
        run: cd frontend && npm run build

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        # Playwright managed webServer boots `npm run dev` automatically.
        # The build step above ensures .next/ exists for the dev server.
        # BASE_URL is consumed by public-pages.spec.ts (absolute URLs);
        # PLAYWRIGHT_MANAGED_WEBSERVER enables the managed webServer in config.
        run: cd frontend && npx playwright test --grep-invert @auth
        env:
          API_PROXY_TARGET: https://elfarocc.tech
          PLAYWRIGHT_MANAGED_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: ""
          BASE_URL: http://localhost:4173
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: Check frontend coverage threshold
        run: |
          COVERAGE=$(cd frontend && npx vitest run --coverage --reporter=json 2>/dev/null | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(f\"{data.get('total', {}).get('lines', {}).get('pct', 0):.1f}\")
          " 2>/dev/null || echo "0")
          echo "Frontend Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 40" | bc -l) )); then
            echo "❌ Frontend coverage below 40% threshold"
            exit 1
          fi

  # ── Database Migrations Check ────────────────────────────────
  migrations-check:
    name: Migrations Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ccf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify migrations apply cleanly
        # The canonical baseline is a current schema snapshot. Later
        # historical revisions are represented by that snapshot and are
        # recorded as applied, matching scripts/provision_quality_database.py.
        run: |
          alembic upgrade 20260702_0001_canonical_baseline
          alembic stamp head
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify downgrade works
        run: |
          alembic downgrade 20260702_0001_canonical_baseline
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify upgrade again
        run: |
          alembic upgrade 20260702_0001_canonical_baseline
          alembic stamp head
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  # ── CRM Tests Gate ───────────────────────────────────────────
  crm-tests:
    name: CRM Functional Tests
    runs-on: ubuntu-latest
    env:
      # Mismo enfoque que backend-quality: SQLite en memoria + xdist.
      DATABASE_URL: "sqlite://"
      TEST_DATABASE_URL: "sqlite://"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CRM tests (SQLite + xdist)
        run: |
          rm -f .coverage .coverage.*
          pytest tests/test_crm_*.py -q -n auto --cov=backend --cov-report=xml --cov-report=term --cov-fail-under=$COV_THRESHOLD

      - name: Upload CRM coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: crm
          fail_ci_if_error: false

  # ── Deploy to Staging ────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: [backend-quality, frontend-quality, migrations-check, crm-tests]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy to Staging
        run: echo "🚀 Deploy to staging would run here"
        # Add your staging deploy script here

  # ── Deploy to Production ─────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: [backend-quality, frontend-quality, migrations-check, crm-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy to Production
        run: echo "🚀 Deploy to production would run here"
        # Add your production deploy script here
