name: CCF CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ccf_test"
  TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ccf_test"
  # Fuente única de verdad del umbral de cobertura backend (heredero en todos
  # los jobs; debe coincidir con el target `make coverage-gate`). Ya no vive en
  # pytest.ini para que los subconjuntos de tests locales no fallen por
  # cobertura parcial.
  COV_THRESHOLD: "38"

jobs:
  # ── Quality Gate ─────────────────────────────────────────────
  backend-quality:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Los tests corren sobre SQLite en memoria (mismo comportamiento que
      # el entorno dev: tests/conftest.py cae a ``sqlite://`` con StaticPool).
      # Con pytest-xdist cada worker es un proceso independiente con su propia
      # BD en memoria → aislamiento seguro y paralelo. El job migrations-check
      # valida Postgres/alembic por separado.
      DATABASE_URL: "sqlite://"
      TEST_DATABASE_URL: "sqlite://"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit ruff

      - name: Lint with Ruff
        # Uses select/ignore/per-file-ignores from pyproject.toml
        run: ruff check backend/

      - name: Lint CRM backend (import organization)
        # Dedicated gate for CRM modules to catch import organization
        # regressions before they reach main.
        run: bash scripts/lint-crm.sh

      - name: Lint Academy backend (import organization)
        run: bash scripts/lint-academy.sh

      - name: Lint Evangelism backend (import organization)
        run: bash scripts/lint-evangelism.sh

      - name: Lint CMS backend (import organization)
        run: bash scripts/lint-cms.sh

      - name: Security scan with Bandit
        # Security findings must fail CI; the JSON report remains available
        # for diagnosis when the scan rejects a change.
        run: bandit -r backend/ -c .bandit -f json -o bandit-report.json

      - name: Type check (mypy)
        run: |
          pip install mypy
          mypy backend/ --config-file mypy.ini --ignore-missing-imports


  # La suite no-CRM completa conserva todas sus pruebas, pero se reparte por
  # archivo en shards estables. Así un archivo lento no bloquea toda la cola y
  # la cobertura se valida únicamente después de combinar todos los shards.
  backend-test-shards:
    name: Backend Tests (${{ matrix.shard }}/4)
    needs: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      DATABASE_URL: "sqlite://"
      TEST_DATABASE_URL: "sqlite://"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deterministic test shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          rm -f .coverage .coverage.*
          python - <<'PY' > /tmp/test-files.txt
          import os
          from pathlib import Path

          shard = int(os.environ["SHARD"])
          files = sorted(
              path.as_posix()
              for path in Path("tests").glob("*.py")
              if not path.name.startswith("test_crm_")
          )
          selected = [path for index, path in enumerate(files) if index % 4 == shard]
          print("\n".join(selected))
          print(f"Selected {len(selected)} files for shard {shard}", file=__import__("sys").stderr)
          PY
          mapfile -t TEST_FILES < /tmp/test-files.txt
          pytest -o addopts= "${TEST_FILES[@]}" -q -n auto --dist loadfile --cov=backend --cov-report=term

      - name: Upload shard coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: error

  backend-coverage:
    name: Backend Coverage Aggregate
    needs: backend-test-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COV_THRESHOLD: "38"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage tooling
        run: python -m pip install coverage==7.14.1

      - name: Download shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: backend-coverage-*
          path: coverage-shards

      - name: Combine and enforce backend coverage
        run: |
          index=0
          while IFS= read -r coverage_file; do
            cp "$coverage_file" ".coverage.shard-$index"
            index=$((index + 1))
          done < <(find coverage-shards -type f -name '.coverage*' | sort)
          coverage combine
          coverage report --fail-under="$COV_THRESHOLD"
          coverage xml -o coverage.xml

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Frontend Quality Gate ────────────────────────────────────
  frontend-quality:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    env:
      # next.config.mjs resolves the API rewrite during `next build`. SSR uses
      # the canonical API while browser requests remain same-origin through
      # Next's /api proxy, so CI never depends on localhost:8000.
      API_PROXY_TARGET: https://ministerioselfaro.org
      API_BASE_URL: https://ministerioselfaro.org/api
      NEXT_PUBLIC_API_URL: /api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Detect new `any` in frontend test files
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          python3 scripts/check-frontend-test-any.py --base-branch origin/${{ github.base_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # The repository lockfile is generated with the workspace's explicit
        # legacy-peer-deps policy. Keep CI and local reproducible installs on
        # the same resolver contract while the Storybook/Vite peer graph is
        # being converged.
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Lint (ESLint)
        run: cd frontend && npm run lint

      - name: Type check (TypeScript)
        run: cd frontend && npx tsc --noEmit

      - name: Run unit tests with coverage
        run: cd frontend && npx vitest run --coverage

      - name: Build
        run: cd frontend && npm run build

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        # Este gate valida la superficie pública estable. Las suites profundas
        # de módulos requieren un staging aislado con fixtures y usuario E2E;
        # ejecutarlas contra producción convierte datos mutables en falsos
        # fallos de código y puede tocar datos reales.
        run: cd frontend && npx playwright test tests/e2e/public-pages.spec.ts
        env:
          PLAYWRIGHT_MANAGED_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: ""
          BASE_URL: http://localhost:4173
          NEXT_PUBLIC_API_URL: /api

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: Check frontend coverage threshold
        run: |
          COVERAGE=$(python3 -c "
          from pathlib import Path
          totals = {'lf': 0, 'lh': 0}
          for line in Path('frontend/coverage/lcov.info').read_text().splitlines():
              if line.startswith('LF:'):
                  totals['lf'] += int(line[3:])
              elif line.startswith('LH:'):
                  totals['lh'] += int(line[3:])
          print(f\"{(totals['lh'] / totals['lf'] * 100) if totals['lf'] else 0:.1f}\")
          ")
          echo "Frontend Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 40" | bc -l) )); then
            echo "❌ Frontend coverage below 40% threshold"
            exit 1
          fi

  # ── Database Migrations Check ────────────────────────────────
  migrations-check:
    name: Migrations Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ccf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify migrations apply cleanly
        # The canonical baseline is a current schema snapshot. Later
        # historical revisions are represented by that snapshot and are
        # recorded as applied, matching scripts/provision_quality_database.py.
        run: |
          alembic upgrade 20260702_0001_canonical_baseline
          alembic stamp head
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify downgrade works
        run: |
          alembic downgrade 20260702_0001_canonical_baseline
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify upgrade again
        run: |
          alembic upgrade 20260702_0001_canonical_baseline
          alembic stamp head
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  # ── CRM Tests Gate ───────────────────────────────────────────
  crm-tests:
    name: CRM Functional Tests
    runs-on: ubuntu-latest
    env:
      # Mismo enfoque que backend-quality: SQLite en memoria + xdist.
      DATABASE_URL: "sqlite://"
      TEST_DATABASE_URL: "sqlite://"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CRM tests (SQLite + xdist)
        run: |
          rm -f .coverage .coverage.*
          pytest tests/test_crm_*.py -q -n auto --cov=backend --cov-report=xml --cov-report=term --cov-fail-under=$COV_THRESHOLD

      - name: Upload CRM coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: crm
          fail_ci_if_error: false

  # ── Deploy to Staging ────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: [backend-quality, frontend-quality, migrations-check, crm-tests]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy to Staging
        run: echo "🚀 Deploy to staging would run here"
        # Add your staging deploy script here

  # ── Deploy to Production ─────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: [backend-quality, frontend-quality, migrations-check, crm-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy to Production
        run: echo "🚀 Deploy to production would run here"
        # Add your production deploy script here
