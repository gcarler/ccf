name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CCF CI/CD Pipeline"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/ccf
            git pull origin main
            # Frontend: secuencia segura build → swap → pm2 restart, solo si hubo
            # cambios en frontend/ (evita rebuild en pushes solo-backend).
            # El restart sin rebuild previo dejaba el sitio sirviendo el build
            # viejo (o chunks huérfanos si un build ajeno tocaba .next en vivo).
            if git diff --name-only HEAD@{1} HEAD | grep -q '^frontend/'; then
              bash /root/ccf/scripts/deploy_frontend.sh
            else
              echo "Sin cambios en frontend/ — no se reconstruye el frontend"
            fi
            /usr/local/bin/pm2 restart ccf-backend-staging
            /usr/local/bin/pm2 status
