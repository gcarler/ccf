[mypy]
python_version = 3.12

# Allow implicit reexport of symbols (used heavily by barrel files
# like backend/models.py and backend/schemas/__init__.py).
implicit_reexport = True

# Disable implicit Optional (PEP 484) because the codebase uses a
# mix of `Optional[T]` and bare `T | None` idioms that are intentional.
no_implicit_optional = False

# Reduce noise from Optional[] unwrapping in legacy code paths.
warn_unused_ignores = False
warn_redundant_casts = False
warn_return_any = False

# Most third-party stubs are missing; let mypy not complain.
ignore_missing_imports = True

# Disable error codes that are pure SQLAlchemy noise with the
# legacy `Column[T]` vocabulary (the project has NOT migrated to
# `Mapped[T]` / `mapped_column()` yet — doing so is tracked
# separately as a backend-wide refactor).
#
# Each disabled code maps to a class of false positives:
#   arg-type      — passing `Column[UUID]` where a function expects `UUID`
#   assignment    — assigning a literal to a `Column[T]` attribute
#   call-overload  — `dict.get(Column[str], ...)` vs `dict.get(str, ...)`
#                    (the project passes ORM column values as dict keys)
#   index         — indexing a `dict` with `Column[str]` rather than `str`
#   list-item     — list comprehension producing `Column[T]` vs `T`
#   misc          — SQLAlchemy attribute descriptors on the class
#   operator      — `<` / `+` on `Column[T]` vs `T`
#   return-value  — function signatures returning `T` while actually
#                   handing back `Column[T]` (legacy models)
#   type-var      — generic TypeVar bound to `Column[T]`
#
# Re-enabling these codes requires first migrating every model file
# to the SQLAlchemy 2.x `Mapped[T]` style. Tracked as a separate
# quality initiative.
disable_error_code =
    arg-type,
    assignment,
    call-overload,
    index,
    list-item,
    misc,
    operator,
    return-value,
    type-var,
    annotation-unchecked,
    prop-decorator,
    var-annotated,
    no-redef,
    attr-defined,
    union-attr

[mypy-backend.models]
ignore_errors = True

