[pytest]
testpaths = tests
# Threshold set to 38% to match current global coverage (~38.5%).
# Last adjusted on 2026-07-29. Target: 70% per REGLAS.md.
# Major gaps: cms_v2.py (21%), pastoral.py (15%), pipelines.py (22%),
# projects.py (17%), crud/cms.py (14%). Next focus areas.
# El umbral estricto NO vive en addopts: aplicado a la suite completa hacía
# que cualquier subconjunto de tests fallara (la cobertura medida es parcial
# y no alcanza el umbral global). El gate de cobertura se ejecuta explícito:
#   - CI: .github/workflows/ci.yml (COV_THRESHOLD=38, --cov-fail-under=$COV_THRESHOLD)
#   - Local: make coverage-gate (pytest tests/ --cov-fail-under=38 ...)
# Reportar cobertura en cada corrida sigue activo (--cov=backend).
addopts = -p no:cacheprovider --cov=backend --cov-report=term-missing
# DeprecationWarnings are displayed but not promoted to errors. The project
# keeps deprecated aliases (e.g. calculate_pastoral_health) and has explicit
# tests that verify they emit DeprecationWarning.
filterwarnings =
    default::DeprecationWarning
